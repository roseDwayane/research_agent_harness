[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-research"
version = "0.1.0"
description = "Standalone, reproducible port of the SCHOLAR /research 9-step literature-review pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.5",
    "httpx>=0.25",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
scholar-research = "scholar_research.cli:main"

[tool.setuptools.packages.find]
include = ["scholar_research*"]

[tool.setuptools.package-data]
"scholar_research.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
