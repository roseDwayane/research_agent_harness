[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-research"
version = "0.1.0"
description = "Standalone, reproducible port of the SCHOLAR /research 9-step literature-review pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.5",
    "httpx>=0.25",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
eval = ["datasets>=2.20"]
litsearch = ["datasets==2.20.0", "numpy==1.26.4", "nltk==3.8.1", "rank-bm25==0.2.2", "pandas==2.2.3", "pyarrow==17.0.0", "huggingface-hub==0.23.4"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
scholar-research = "scholar_research.cli:main"

[tool.setuptools.packages.find]
include = ["scholar_research*", "evaluation.step02*", "evaluation.step03*", "evaluation.step08*"]

[tool.setuptools.package-data]
"scholar_research.llm" = ["prompts/*.md"]
"evaluation.step02" = ["*.json"]
"evaluation.step08" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
